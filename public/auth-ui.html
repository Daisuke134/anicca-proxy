<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anicca - Connect Services</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background-color: #f5f5f7;
            color: #1d1d1f;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            padding: 40px;
            max-width: 600px;
            width: 100%;
        }

        h1 {
            font-size: 32px;
            font-weight: 600;
            margin-bottom: 10px;
            text-align: center;
        }

        .subtitle {
            color: #86868b;
            font-size: 18px;
            text-align: center;
            margin-bottom: 40px;
        }

        .services-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .service-card {
            background: #f5f5f7;
            border-radius: 16px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .service-card:hover {
            background: #e8e8ed;
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
        }

        .service-card.connected {
            background: #e8f5e9;
            border: 2px solid #4caf50;
        }

        .service-card .icon {
            width: 48px;
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .service-card .icon img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .service-card .name {
            font-size: 14px;
            font-weight: 500;
            text-align: center;
        }

        .service-card .status {
            position: absolute;
            top: 8px;
            right: 8px;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #4caf50;
            display: none;
        }

        .service-card.connected .status {
            display: block;
        }

        .coming-soon {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .coming-soon::after {
            content: "Coming Soon";
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(0, 0, 0, 0.8);
            color: white;
            font-size: 10px;
            padding: 4px;
            text-align: center;
        }

        .info-box {
            background: #f5f5f7;
            border-radius: 12px;
            padding: 16px;
            margin-top: 20px;
            font-size: 14px;
            color: #86868b;
            text-align: center;
        }

        .loading {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(255, 255, 255, 0.9);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .loading.active {
            display: flex;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #3498db;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Connect Your Services</h1>
        <p class="subtitle">Click on a service to connect it with Anicca</p>
        
        <div class="services-grid">
            <div class="service-card" data-service="slack" onclick="connectService('slack')">
                <div class="icon">
                    <img src="/icons/slack.svg" alt="Slack">
                </div>
                <div class="name">Slack</div>
                <div class="status"></div>
            </div>
            
            <div class="service-card coming-soon" data-service="google-calendar">
                <div class="icon">
                    <svg viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
                        <rect fill="#1976D2" height="22" width="22" y="26"/>
                        <rect fill="#EF5350" height="22" width="22" x="26"/>
                        <rect fill="#34A853" height="22" width="22" y="26" x="26"/>
                        <rect fill="#FBC02D" height="22" width="22" x="26" y="26"/>
                    </svg>
                </div>
                <div class="name">Google Calendar</div>
                <div class="status"></div>
            </div>
            
            <div class="service-card coming-soon" data-service="github">
                <div class="icon">
                    <svg viewBox="0 0 24 24" fill="#24292e">
                        <path d="M12 2C6.477 2 2 6.477 2 12c0 4.42 2.865 8.17 6.84 9.49.5.09.68-.22.68-.48 0-.24-.01-.87-.01-1.71-2.78.6-3.37-1.34-3.37-1.34-.46-1.16-1.11-1.47-1.11-1.47-.91-.62.07-.61.07-.61 1 .07 1.53 1.03 1.53 1.03.89 1.52 2.34 1.08 2.91.83.09-.65.35-1.09.63-1.34-2.22-.25-4.56-1.11-4.56-4.93 0-1.09.39-1.98 1.03-2.68-.1-.25-.45-1.27.1-2.64 0 0 .84-.27 2.75 1.02.8-.22 1.65-.33 2.5-.33.85 0 1.7.11 2.5.33 1.91-1.29 2.75-1.02 2.75-1.02.55 1.37.2 2.39.1 2.64.64.7 1.03 1.59 1.03 2.68 0 3.84-2.34 4.68-4.57 4.93.36.31.68.92.68 1.85 0 1.34-.01 2.42-.01 2.74 0 .27.18.58.69.48A10.02 10.02 0 0022 12c0-5.523-4.477-10-10-10z"/>
                    </svg>
                </div>
                <div class="name">GitHub</div>
                <div class="status"></div>
            </div>
            
            <div class="service-card coming-soon" data-service="gmail">
                <div class="icon">
                    <svg viewBox="0 0 48 48">
                        <path fill="#EA4335" d="M5 13v22q0 2.07 1.47 3.54Q7.93 40 10 40h4V18L8 13z"/>
                        <path fill="#34A853" d="M34 40h4q2.07 0 3.54-1.46Q43 37.07 43 35V13l-6 5z"/>
                        <path fill="#FBBC04" d="M34 18v22h-20V18l10-8z"/>
                        <path fill="#4285F4" d="M43 8v5l-19 15L5 13V8q0-2.07 1.47-3.54Q7.93 3 10 3q.85 0 1.65.35.8.35 1.35 1.05l11 9 11-9q.55-.7 1.35-1.05Q37.15 3 38 3q2.07 0 3.54 1.46Q43 5.93 43 8z"/>
                    </svg>
                </div>
                <div class="name">Gmail</div>
                <div class="status"></div>
            </div>
        </div>
        
        <div class="info-box">
            Connected services can be accessed through voice commands with Anicca
        </div>
    </div>
    
    <div class="loading" id="loading">
        <div class="spinner"></div>
    </div>

    <script>
        // Check connected services on load
        window.onload = async function() {
            try {
                const response = await fetch('/api/aci/connected-services');
                if (response.ok) {
                    const data = await response.json();
                    data.connectedServices?.forEach(service => {
                        const card = document.querySelector(`[data-service="${service}"]`);
                        if (card) {
                            card.classList.add('connected');
                        }
                    });
                }
            } catch (error) {
                console.error('Failed to load connected services:', error);
            }
        };

        async function connectService(service) {
            if (service !== 'slack') {
                return; // Only Slack is available now
            }
            
            const loading = document.getElementById('loading');
            loading.classList.add('active');
            
            try {
                // Get OAuth URL from backend
                const response = await fetch('/api/aci/oauth-url', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ 
                        service: service,
                        // Get user session ID if available
                        sessionId: localStorage.getItem('aniccaSessionId')
                    })
                });
                
                if (!response.ok) {
                    throw new Error('Failed to get OAuth URL');
                }
                
                const data = await response.json();
                
                // Redirect to OAuth URL
                window.location.href = data.oauthUrl;
                
            } catch (error) {
                console.error('Connection error:', error);
                alert('Failed to connect service. Please try again.');
            } finally {
                loading.classList.remove('active');
            }
        }
    </script>
</body>
</html>
